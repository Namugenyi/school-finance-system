name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04 # Playwright 1.56 has no browser build for Ubuntu 26.04 yet
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stja_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stja_test
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stja_e2e
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stja_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        working-directory: apps/api
      - run: npm run typecheck
      - name: API and unit tests
        run: npm test
      - run: npm run build
      - name: Create the browser-test database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c "create database stja_e2e"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Browser journeys
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: apps/web/test-results
