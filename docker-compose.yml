# Local or single-server deployment. Put HTTPS in front of port 4000 (for example Caddy or nginx).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: stja
      POSTGRES_USER: stja
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stja -d stja"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://stja:${DB_PASSWORD}@db:5432/stja
      APP_ORIGIN: ${APP_ORIGIN:-https://finance.example.ug}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    ports:
      - "4000:4000"

volumes:
  pgdata:
